<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Project Not Found</title>
    <link rel="stylesheet" href="css/404.css">
</head>
<body>
    <div class="error-page-container">
      
        <div class="bg-circle left-circle"></div>
        <div class="bg-circle right-circle"></div>

        <div class="content-wrapper">
            <div class="graphic-element">
               <img src="img/circles-colored.svg" alt="404 Graphic" class="svg-graphic" />
            </div>
            
            <h1 class="error-code">404</h1>
            <h2 class="error-title">This project isn't in the directory.</h2>
            <p class="error-desc">
                It may have been archived, renamed,
                or the link is out of<br>date. Head back
                and search for it instead.
            </p>
            
            <a href="404.html" class="primary-btn">Back to gallery</a>
        </div>
    </div>
</body>
</html>
