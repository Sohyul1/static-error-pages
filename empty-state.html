<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empty State - Projects</title>
    <link rel="stylesheet" href="empty-state.css">
</head>
<body>
    <div class="empty-state-frame">
        
        <!-- Navigation Bar -->
        <nav class="navigation">
            <div class="logo-group">
               
                <img src="logo.svg" alt="CertiCode Logo" class="logo-graphic" />
                <span class="logo-text">CERTICODE</span>
            </div>
            
            <div class="nav-links">
                <a href="#">Projects</a>
                <a href="#">Archive</a>
                <a href="#">About</a>
            </div>
            
            <a href="#" class="admin-login-btn">Admin login</a>
        </nav>

        <!-- Main Body Content -->
        <div class="body-content">
            <div class="circles-graphic">
                <img src="circles.svg" alt="No results graphic" />
            </div>
            
            <h2 class="heading-2">No projects match "GraphQL dashboard"</h2>
            
            <p class="description-text">
                Try a different keyword, or clear your filters to see the<br>
                full directory again.
            </p>
            
            <button class="secondary-btn">Clear all filters</button>
        </div>
        
    </div>
